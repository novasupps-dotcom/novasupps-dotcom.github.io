<style>

  /* 2.17.2 · Buscador (iOS / One UI): campo de 44 px con esquinas de píldora y, a un lado, el botón
     de filtro circular de 44 px (área táctil mínima de Apple y Samsung) con el número de filtros. */
  .searchrow { display: flex; align-items: center; gap: 10px; }
  .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 14px; border-radius: 22px; background: rgba(118, 118, 128, .12); transition: box-shadow .15s; }

  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 17px; letter-spacing: -.2px; }

  .fsum2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 20px 4px 0; }

  .fsum2 span { min-width: 30px; height: 26px; border-radius: 13px; background: #E9E9EE; color: var(--muted); font-size: 13px; font-weight: 700; display: grid; place-items: center; padding: 0 8px; }
  /* Hoja «Filtrar productos» */

  /* Foto cuadrada que siempre muestra el producto completo (alto o ancho), sin recortes. */

  .ribbon { position: absolute; top: 10px; left: 10px; width: auto; padding: 5px 11px; border-radius: 999px; background: linear-gradient(135deg, rgba(22,163,74,0.92), rgba(16,185,129,0.88)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.35); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .25px; text-transform: uppercase; text-align: center; transform: none; box-shadow: 0 4px 12px rgba(22,163,74,0.22); z-index: 2; pointer-events: none; line-height: 1.1; }
  .open { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .zoom { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgba(28,28,30,.55); display: grid; place-items: center; }

  .pick { border: 0; background: transparent; color: var(--green); font-weight: 700; font-size: 13.5px; padding: 4px 0 0; text-align: left; }
  .fsum { font-size: 12.5px; color: var(--green); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Ficha del producto */

  .big .ribbon { top: 10px; left: 10px; width: auto; font-size: 10.5px; padding: 5px 11px; border-radius: 999px; transform: none; }
  .big img { display: block; width: 100%; max-height: 62vh; object-fit: contain; }
  .big svg { width: 50%; height: 220px; stroke: #D1D1D6; fill: none; stroke-width: 1.2; }
  .dt h2 { font-size: 22px; letter-spacing: -.3px; line-height: 1.2; margin: 6px 0; }
  .dt .price b { font-size: 22px; }
  .flv { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }

  /* Barra fija */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(242,242,247,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); transform: translateY(110%); transition: transform .25s; z-index: 5; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 2px 6px; }

    rpc("b2b_payment_register", { p_token: token, p_payment_id: String(payId), p_status: String(status || ""), p_payment_type: String(payType || ""), p_external_reference: String(extRef || ""), p_code: payCode || null }).then(function (r) { showPayBanner(!!(r && r.ok)); }).catch(function () { showPayBanner(false); }); } if (demo) return start(DEMO);
  if (!/^[a-z0-9]{16,64}$/.test(token)) return message("Enlace incompleto", "Abre el enlace completo que te mandamos por WhatsApp.");
  rpc("b2b_order_page_get", { p_token: token })
    .then(function (d) {
      // 2.15.8 · Enlace en pausa: sin catálogo, con botón de WhatsApp.
      if (d && d.paused) {
        var pw = String(d.whatsapp || "").replace(/\D/g, "");
        var pUrl = pw.length >= 10 ? "https://wa.me/" + (pw.length === 10 ? "52" + pw : pw) + "?text=" + encodeURIComponent("Hola, quiero hacer un pedido.") : "";
        $("main").innerHTML = '<div class="card msg"><h2>Pedidos en línea en pausa</h2><p>Por ahora no estamos recibiendo pedidos en línea' + (d.store ? " en " + esc(d.store) : "") + ". Escríbenos por WhatsApp y con gusto te atendemos.</p>" +
          (pUrl ? '<a class="cta full" style="display:block;margin-top:18px;text-decoration:none" href="' + esc(pUrl) + '" target="_blank" rel="noopener noreferrer">Escribir por WhatsApp</a>' : "") + "</div>";
        return;
      }
      if (!d || !d.catalog) return message("Este enlace ya no está activo", "Pídenos tu enlace actualizado por WhatsApp.");
      start(d);
    })
    .catch(function () { message("No se pudo cargar el catálogo", "Revisa tu internet y vuelve a abrir el enlace."); });
})();
</script>
