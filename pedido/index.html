<style>
  /* 2.18.12 · Rediseño (skill diseno-suplementos + Impeccable): lienzo cálido, una sola acción
     (tinta), rojo de marca solo como acento y Bricolage Grotesque en títulos y precios. */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800; font-display: swap;

    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* 2.18.13 · El anillo va por dentro (box-shadow): el campo no cambia de tamaño ni se desfasa. */
  .field:focus-visible, .step input:focus-visible, .flav:focus-visible, .colq input:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--ink); background: var(--paper); }
