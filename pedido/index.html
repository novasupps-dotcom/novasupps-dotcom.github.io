<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F7">
<title>Arma tu pedido · GGG Nova Supps</title>
<style>
  :root {
    --bg: #F2F2F7; --paper: #fff; --ink: #1C1C1E; --muted: #6C6C70; --faint: #AEAEB2; --line: #E3E3E8;
    --red: #D9252F; --redSoft: #FDECEC; --green: #1F7A3D; --greenSoft: #E7F5EC; --amber: #9A5B00; --amberSoft: #FFF4E0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body.lock { overflow: hidden; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 120px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; min-height: 38px; }
  header img { height: 38px; width: auto; }
  header a { font-size: 14px; font-weight: 600; color: var(--green); text-decoration: none; }
  .card { background: var(--paper); border-radius: 24px; padding: 20px; margin-bottom: 12px; }
  .hero .sec { margin: 0; }
  .hero h1 { font-size: 26px; line-height: 1.15; margin: 6px 0 6px; letter-spacing: -.4px; }
  .hero p { color: var(--muted); font-size: 15px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--greenSoft); color: var(--green); margin-top: 12px; }
  .sec { font-size: 12.5px; font-weight: 600; letter-spacing: .8px; color: var(--muted); margin: 18px 4px 10px; }
  /* Buscador con «Filtrar» adentro (igual que Vender en la app). */
  .search { display: flex; align-items: center; gap: 8px; background: #E9E9EE; border-radius: 999px; padding: 6px 6px 6px 16px; height: 54px; }
  .search > svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16.5px; height: 100%; }
  .search input::-webkit-search-cancel-button { display: none; }
  .fbtn { flex: none; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: var(--red); color: #fff; font-size: 15px; font-weight: 700; padding: 0 16px; height: 42px; }
  .fbtn svg { width: 17px; height: 17px; stroke: #fff; fill: none; stroke-width: 2.2; }
  .fbtn i { font-style: normal; min-width: 20px; height: 20px; border-radius: 10px; background: #fff; color: var(--red); font-size: 12px; display: grid; place-items: center; padding: 0 5px; }
  .fsum2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 16px 4px 0; }
  .fsum2 b { font-size: 22px; letter-spacing: -.3px; }
  .fsum2 span { min-width: 30px; height: 26px; border-radius: 13px; background: #E9E9EE; color: var(--muted); font-size: 13px; font-weight: 700; display: grid; place-items: center; padding: 0 8px; }
  /* Hoja «Filtrar productos» */
  .fsheet { position: fixed; inset: 0; z-index: 30; display: none; }
  .fsheet.on { display: block; }
  .fsheet .dim { position: absolute; inset: 0; background: rgba(0,0,0,.38); }
  .fsheet .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; display: flex; flex-direction: column; background: #fff; border-radius: 24px 24px 0 0; padding: 10px 18px calc(14px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40%); opacity: .6; } to { transform: none; opacity: 1; } }
  .fsheet .handle { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
  .fsheet .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .fsheet .head b { font-size: 19px; font-weight: 800; }
  .fsheet .head div { display: flex; align-items: center; gap: 8px; }
  .reset { border: 0; border-radius: 999px; background: #F2F2F7; color: var(--red); font-size: 13px; font-weight: 700; padding: 6px 11px; }
  .xbtn { width: 34px; height: 34px; border-radius: 17px; border: 0; background: #F2F2F7; display: grid; place-items: center; }
  .xbtn svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2.4; }
  .fbody { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; padding-bottom: 6px; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .qc { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; background: #F2F2F7; padding: 8px 14px; font-size: 14px; font-weight: 600; }
  .qc.on { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
  .qc svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 3; }
  .acc { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
  .acch { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 0; background: #fff; padding: 14px; text-align: left; }
  .acch b { font-size: 16px; font-weight: 700; }
  .acch span { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .acch span.on { color: var(--red); }
  .acch svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2.2; transition: transform .2s; }
  .acc.open .acch svg { transform: rotate(180deg); }
  .ck { width: 100%; display: flex; align-items: center; gap: 14px; border: 0; border-top: 1px solid var(--line); background: #fff; padding: 13px 14px; text-align: left; font-size: 16px; }
  .ck.on { background: var(--redSoft); color: var(--red); font-weight: 700; }
  .ck i { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #C7C7CC; display: grid; place-items: center; flex: none; }
  .ck.on i { background: var(--red); border-color: var(--red); }
  .ck i svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 3; }
  .ck em { flex: 1; font-style: normal; }
  .ck small { color: var(--muted); font-size: 14.5px; font-weight: 600; }
  .fgo { width: 100%; border: 0; border-radius: 999px; background: var(--red); color: #fff; font-size: 17px; font-weight: 700; padding: 16px; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .p { background: var(--paper); border-radius: 24px; padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; }
  .p.sel { box-shadow: inset 0 0 0 2px var(--green); }
  /* Foto cuadrada que siempre muestra el producto completo (alto o ancho), sin recortes. */
  .ph { position: relative; width: 100%; padding-top: 100%; border-radius: 14px; background: #fff; overflow: hidden; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .ph svg { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; stroke: #D1D1D6; fill: none; stroke-width: 1.5; }
  .ribbon { position: absolute; top: 10px; left: 10px; width: auto; padding: 5px 11px; border-radius: 999px; background: linear-gradient(135deg, rgba(22,163,74,0.92), rgba(16,185,129,0.88)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.35); color: #fff; font-size: 9px; font-weight: 800; letter-spacing: .25px; text-transform: uppercase; text-align: center; transform: none; box-shadow: 0 4px 12px rgba(22,163,74,0.22); z-index: 2; pointer-events: none; line-height: 1.1; }
  .open { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .zoom { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 50%; background: rgba(28,28,30,.55); display: grid; place-items: center; }
  .zoom svg { position: static; width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2.2; }
  .pick { border: 0; background: transparent; color: var(--green); font-weight: 700; font-size: 13.5px; padding: 4px 0 0; text-align: left; }
  .fsum { font-size: 12.5px; color: var(--green); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Ficha del producto */
  .big { position: relative; background: #fff; border-radius: 24px; overflow: hidden; display: flex; justify-content: center; }
  .big .ribbon { top: 10px; left: 10px; width: auto; font-size: 10.5px; padding: 5px 11px; border-radius: 999px; transform: none; }
  .big img { display: block; width: 100%; max-height: 62vh; object-fit: contain; }
  .big svg { width: 50%; height: 220px; stroke: #D1D1D6; fill: none; stroke-width: 1.2; }
  .dt h2 { font-size: 22px; letter-spacing: -.3px; line-height: 1.2; margin: 6px 0; }
  .dt .price b { font-size: 22px; }
  .flv { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .flv:last-child { border-bottom: 0; }
  .flv span { flex: 1; font-size: 15.5px; font-weight: 600; }
  .flv .step { width: 132px; flex: none; }
  .brand { font-size: 11.5px; font-weight: 700; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name { font-size: 14.5px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .price b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .price s { font-size: 12.5px; color: var(--faint); }
  .add { border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14.5px; height: 40px; width: 100%; }
  .add:disabled { background: #E9E9EE; color: var(--faint); cursor: default; }
  .step { display: flex; align-items: center; gap: 6px; height: 40px; }
  .step button { width: 40px; height: 40px; border: 0; border-radius: 12px; background: #E9E9EE; font-size: 20px; font-weight: 700; line-height: 1; flex: none; }
  .step button.plus { background: var(--green); color: #fff; }
  .step input { flex: 1; min-width: 0; height: 40px; border: 0; border-radius: 12px; background: #F2F2F7; text-align: center; font-size: 16px; font-weight: 700; outline: 0; }
  .flav { width: 100%; border: 0; border-radius: 10px; background: #F2F2F7; padding: 8px 10px; font-size: 14px; outline: 0; }
  .stock { font-size: 12px; font-weight: 600; color: var(--amber); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .more { display: block; width: 100%; margin-top: 12px; border: 0; border-radius: 16px; background: var(--paper); padding: 14px; font-weight: 600; }
  /* Barra fija */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(242,242,247,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); transform: translateY(110%); transition: transform .25s; z-index: 5; }
  .bar.on { transform: none; }
  .bar .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .bar .sum { flex: 1; min-width: 0; }
  .bar .sum b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .bar .sum span { font-size: 13px; color: var(--muted); }
  .cta { border: 0; border-radius: 16px; background: var(--green); color: #fff; font-size: 16.5px; font-weight: 700; padding: 14px 20px; }
  .cta:disabled { background: #C7C7CC; }
  .cta.full { width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
  .cta.dark { background: var(--ink); }
  .ghost { width: 100%; border: 0; border-radius: 16px; background: #E9E9EE; font-size: 16px; font-weight: 600; padding: 14px; margin-top: 8px; }
  /* Revisión (pantalla completa) */
  .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; }
  .sheet.on { display: block; }
  .sheet .wrap { padding-bottom: 40px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .top button { border: 0; background: transparent; color: var(--red); font-size: 17px; font-weight: 600; padding: 6px 0; }
  .top h2 { flex: 1; text-align: center; font-size: 17px; margin-right: 54px; }
  .line { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .line .ph { width: 52px; height: 52px; padding-top: 0; flex: none; border-radius: 10px; }
  .line .t { flex: 1; min-width: 0; }
  .line .t div { font-size: 15px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .line .t span { font-size: 13px; color: var(--muted); }
  .line .step { width: 116px; flex: none; gap: 4px; }
  .line .step button { width: 36px; height: 36px; }
  .line .step input { height: 36px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 15px; }
  .row span:first-child { color: var(--muted); }
  .row b { font-variant-numeric: tabular-nums; text-align: right; }
  .row.off b { color: var(--green); }
  .total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-size: 18px; }
  .note { border-radius: 14px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
  .note.ok { background: var(--greenSoft); color: var(--green); }
  .note.warn { background: var(--amberSoft); color: var(--amber); }
  .note.bad { background: var(--redSoft); color: #C4161C; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 2px 6px; }
  .field { width: 100%; border: 0; border-radius: 14px; background: #F2F2F7; padding: 13px 14px; font-size: 16px; outline: 0; }
  textarea.field { min-height: 80px; resize: vertical; }
  select.field { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, #8E8E93 50%), linear-gradient(135deg, #8E8E93 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; color: var(--ink); }
  .two { display: grid; grid-template-columns: 1fr 112px; gap: 10px; }
  .pay { display: flex; gap: 12px; align-items: flex-start; margin: 8px 0 0; padding: 12px 14px; border-radius: 14px; background: #F2F2F7; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
  .pay input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ink); flex: 0 0 auto; }
  .pay small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; font-weight: 400; }
  .pay.on { background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); }
  .hint { color: var(--muted); font-size: 13px; margin: 2px 2px 0; }
  .done { text-align: center; padding: 26px 10px 10px; }
  .done .ok { width: 72px; height: 72px; border-radius: 50%; background: var(--greenSoft); display: grid; place-items: center; margin: 0 auto 14px; }
  .done .ok svg { width: 38px; height: 38px; stroke: var(--green); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .done h2 { font-size: 24px; letter-spacing: -.3px; }
  .done p { color: var(--muted); margin-top: 8px; font-size: 15.5px; }
  .code { display: inline-block; margin-top: 14px; padding: 8px 16px; border-radius: 12px; background: #F2F2F7; font-size: 20px; font-weight: 800; letter-spacing: 2px; }
  .msg { text-align: center; padding: 50px 20px; }
  .msg h2 { font-size: 21px; margin-bottom: 8px; }
  .msg p { color: var(--muted); }
  .skel { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #eee, #f6f6f6, #eee); background-size: 200% 100%; animation: sk 1.2s infinite; margin: 10px 0; }
  @keyframes sk { to { background-position: -200% 0; } }
  .demo { display: flex; align-items: center; gap: 10px; background: #1C1C1E; color: #fff; }
  .demo b { display: block; font-size: 15px; }
  .demo span { font-size: 13px; color: #C7C7CC; }
  .foot { text-align: center; color: var(--faint); font-size: 12px; margin-top: 18px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <img src="logo.png" alt="GGG · Nova Supps" width="90" height="38">
    <a id="wa" href="#" hidden>WhatsApp</a>
  </header>
  <main id="main">
    <div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:22px"></div><div class="skel"></div><div class="skel" style="width:85%"></div></div>
  </main>
  <p class="foot">GGG · Nova Supps · Pedidos para distribuidores</p>
</div>
<div class="bar" id="bar"><div class="in"><div class="sum"><b id="bartotal">$0.00</b><span id="barinfo">0 piezas</span></div><button class="cta" id="review" type="button">Revisar pedido</button></div></div>
<div class="sheet" id="sheet"><div class="wrap" id="sheetin"></div></div>
<div class="sheet" id="detail" style="z-index:20"><div class="wrap" id="detailin"></div></div>
<div class="fsheet" id="fsheet"></div>
<script>
(function () {
  // Base en línea de la tienda (la clave publicable es pública por diseño; las funciones solo
  // devuelven el catálogo de un enlace activo y reciben pedidos validados:
  // supabase/migrations/2.15.0_b2b_pedidos.sql).
  var SUPABASE = "https://yqosgsrqffiyrwpgqxag.supabase.co";
  var KEY = "sb_publishable_ZjMxBiCaO2YYrZxEX3xrdA_0zhjqJsl";
  var PAGE = 60;
  var params = new URLSearchParams(location.search);
  var token = (params.get("l") || "").trim();
  var demo = params.get("demo");
  var data = null, products = [], byId = {};
  var cart = {}, flavors = {}, flavorQty = {}, contact = {}, notes = "";
  var detailId = "";
  var query = "", shown = PAGE, sending = false;
  // 2.15.3 · Filtro igual al de Vender: rápidos (existencia, precio), tipo de suplemento, marca y precio.
  var fl = { tipos: [], marcas: [], precios: [], avail: false, sort: "" }, acc = { tipo: true, marca: false, precio: false };
  var PRICES = [["p1", "Hasta $500", 0, 50000], ["p2", "$500 – $900", 50000, 90000], ["p3", "Más de $900", 90000, Infinity]];

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (c) { return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format((Number(c) || 0) / 100); };
  var fold = function (s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); };
  var pct = function (amount, bps) { return Math.round((amount * bps) / 10000); };
  var plural = function (n, one, many) { return n + " " + (n === 1 ? one : many); };
  var $ = function (id) { return document.getElementById(id); };
  var ICON_JAR = '<svg viewBox="0 0 24 24"><path d="M8 3h8v3H8z"/><path d="M7 6h10a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><path d="M9 11h6M9 15h6"/></svg>';
  var ICON_SEARCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
  var ICON_SLIDERS = '<svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>';
  var ICON_X = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  var ICON_DOWN = '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
  var ICON_ZOOM = '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';

  // ------------------------------------------------------------ memoria de la pestaña
  // 2.15.2 · Cada vez que se abre el enlace empieza en limpio: sin pedidos anteriores ni datos de
  // otra persona. Solo la pestaña abierta recuerda el carrito (por si se recarga la página).
  var LS = "nova-pedido-" + (demo ? "demo" : token);
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("nova-pedido-") === 0) localStorage.removeItem(k); }); } catch (e) {}
  function load() {
    try {
      var s = JSON.parse(sessionStorage.getItem(LS) || "{}");
      cart = s.cart || {}; flavors = s.flavors || {}; flavorQty = s.flavorQty || {};
    } catch (e) {}
  }
  function save() {
    try { sessionStorage.setItem(LS, JSON.stringify({ cart: cart, flavors: flavors, flavorQty: flavorQty })); } catch (e) {}
  }

  // ------------------------------------------------------------ precios
