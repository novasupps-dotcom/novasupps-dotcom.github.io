<style>
  :root {
    --bg: #F2F2F7; --paper: #fff; --ink: #1C1C1E; --muted: #6C6C70; --faint: #AEAEB2; --line: #E3E3E8;
    --red: #D9252F; --green: #1F7A3D; --amber: #9A5B00; --amberSoft: #FFF4E0; --c: #C8962E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; min-height: 38px; }
  header img { height: 38px; width: auto; }
  header .live { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  header .live i { width: 8px; height: 8px; border-radius: 50%; background: #34C759; animation: live 2s infinite; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(52,199,89,.55); } 70% { box-shadow: 0 0 0 8px rgba(52,199,89,0); } 100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); } }
  .card { background: var(--paper); border-radius: 24px; padding: 20px; margin-bottom: 12px; }
  .hero .folio { font-size: 12.5px; font-weight: 600; letter-spacing: .8px; color: var(--muted); }
  .hero h1 { font-size: 26px; line-height: 1.15; margin: 6px 0 4px; letter-spacing: -.4px; }
  .hero p { color: var(--muted); font-size: 15px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; background: var(--c); margin-top: 12px; }
  /* Barra de avance: todo en porcentajes (no se recalcula al girar el teléfono ni al ocultar la barra del navegador). */
  .track { position: relative; margin: 34px 2px 4px; height: 36px; }
  .lane { position: absolute; left: 16px; right: 16px; top: 15px; height: 6px; }
  .rail { position: absolute; inset: 0; border-radius: 3px; background: var(--line); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--c); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .truck { position: absolute; left: 0; top: -34px; transform: translateX(-50%); transition: left 1.2s cubic-bezier(.2,.8,.2,1); display: none; }
  .truck span { display: inline-grid; place-items: center; background: var(--c); border-radius: 12px; padding: 5px 7px; animation: bump .9s ease-in-out infinite; }
  .truck svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes bump { 50% { transform: translateY(-3px); } }
  .nodes { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; }
  .node { position: relative; width: 32px; height: 32px; border-radius: 50%; background: #E9E9EE; display: grid; place-items: center; transition: background .5s; }
  .node svg { width: 16px; height: 16px; stroke: var(--faint); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .node.done { background: var(--c); }
  .node.done svg { stroke: #fff; }
  .node.current { background: #fff; box-shadow: inset 0 0 0 3px var(--c); }
  .node.current svg { stroke: var(--c); }
  .node.current::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: var(--c); opacity: .35; animation: pulse 1.6s ease-out infinite; z-index: -1; }
  @keyframes pulse { 0% { transform: scale(.7); opacity: .45; } 100% { transform: scale(1.7); opacity: 0; } }
  .node.waiting { background: var(--amberSoft); box-shadow: inset 0 0 0 2px var(--amber); }
  .node.waiting svg { stroke: var(--amber); }
  .dead .node.done, .dead .fill { background: var(--faint); }
  .labels { display: grid; grid-template-columns: repeat(6, 1fr); margin: 6px -10px 0; }
  .labels div { text-align: center; font-size: 10.5px; line-height: 1.25; letter-spacing: -.1px; color: var(--faint); padding: 0; overflow-wrap: normal; hyphens: none; }
  .labels div.on { color: var(--ink); font-weight: 600; }
  .labels div.cur { color: var(--ink); font-weight: 800; }
  /* Línea de tiempo */
  .timeline { margin-top: 22px; }
  .tl { display: flex; gap: 12px; min-height: 52px; }
  .anim .tl { opacity: 0; transform: translateY(6px); animation: in .5s forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .tl .dotcol { width: 14px; display: flex; flex-direction: column; align-items: center; flex: none; }
  .tl .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: #fff; margin-top: 4px; }
  .tl.done .dot { background: var(--c); border-color: var(--c); }
  .tl.current .dot { border-color: var(--c); }
  .tl.waiting .dot { background: var(--amber); border-color: var(--amber); }
  .tl .bar { flex: 1; width: 2px; background: var(--line); margin: 3px 0; }
  .tl.done .bar { background: var(--c); }
  .tl h3 { font-size: 15.5px; font-weight: 600; }
  .tl.todo h3 { color: var(--muted); font-weight: 500; }
  .tl p { font-size: 13.5px; color: var(--muted); margin: 2px 0 10px; }
  /* Mapa del reparto */
  #map { height: 300px; border-radius: 16px; overflow: hidden; margin-top: 12px; background: #e9e9ee; z-index: 0; }
  .maptop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .big { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .driver { width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); display: grid; place-items: center; }
  .driver svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; transition: transform .3s; }
  /* 2.18.16 · El carrito voltea hacia donde avanza. */
  .driver.west svg { transform: scaleX(-1); }
  .dest { width: 18px; height: 18px; border-radius: 50%; background: var(--red); border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  /* 2.18.16 · Modo navegación (como Maps o Waze): al estar «Cerca de tu zona» el mapa crece, sigue al
     repartidor y muestra la ruta por las calles hasta tu punto. */
  #mapcard.nav #map { height: 62vh; min-height: 360px; }
  #mapcard.nav .maptop { background: var(--c); color: #fff; margin: -18px -18px 0; padding: 14px 18px; border-radius: 20px 20px 0 0; }
  #mapcard.nav .maptop .sec, #mapcard.nav #mapinfo { color: rgba(255,255,255,.88) !important; }
  /* 2.18.17 · «Tu pedido llegó»: aviso grande para que el cliente salga. */
  .arrive { display: flex; align-items: center; gap: 12px; margin: 12px 0 0; padding: 14px 16px; border-radius: 16px; background: #1F7A3D; color: #fff; }
  .arrive[hidden] { display: none; }
  .arrive .ring { flex: none; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; animation: ring 1.6s ease-out infinite; }
  .arrive svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arrive b { display: block; font-size: 17px; }
  .arrive span { font-size: 14px; color: rgba(255,255,255,.9); }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); } 100% { box-shadow: 0 0 0 16px rgba(255,255,255,0); } }
  .eta { font-size: 13px; font-weight: 600; color: var(--muted); }
  /* Datos */
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 15px; }
  .row span:first-child { color: var(--muted); }
  .row b { font-variant-numeric: tabular-nums; text-align: right; }
  .total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-size: 17px; }
  .sec { font-size: 12.5px; font-weight: 600; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; }
  .meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 10px; }
  .meter i { display: block; height: 100%; border-radius: 4px; transition: width 1s; }
  .light { display: flex; align-items: center; gap: 10px; }
  .light i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .copy { border: 0; background: #E9E9EE; border-radius: 10px; padding: 4px 10px; font-size: 13px; font-weight: 600; cursor: pointer; margin-left: 6px; }
  details summary { cursor: pointer; font-size: 15px; font-weight: 600; list-style: none; padding-top: 8px; }
  details summary::-webkit-details-marker { display: none; }
  details ul { list-style: none; margin-top: 10px; }
  details li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  details li span { flex: 1; }
  details li b { white-space: nowrap; }
  details li .lph { flex: 0 0 52px; width: 52px; height: 52px; border-radius: 12px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); object-fit: contain; }
  /* 2.15.4 · Lo oculto se queda oculto aunque su clase tenga display (la barra de demostración salía en los pedidos reales). */
  [hidden] { display: none !important; }
  .wa { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 18px; background: #1F7A3D; color: #fff; font-size: 17px; font-weight: 600; padding: 16px; text-decoration: none; }
  .paybtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 12px; border-radius: 16px; background: #009EE3; color: #fff; font-size: 16px; font-weight: 700; padding: 14px; text-decoration: none; }
  .paynote { text-align: center; color: var(--muted); font-size: 12.5px; margin: 6px 0 14px; }
  .paymsg { border-radius: 16px; padding: 12px 14px; font-size: 14.5px; margin-bottom: 12px; }
  .paymsg.ok { background: #E7F5EC; color: var(--green); }
  .paymsg.warn { background: var(--amberSoft); color: var(--amber); }
  .paymsg.bad { background: #FDE8E8; color: #C4161C; }
  .foot { text-align: center; color: var(--faint); font-size: 12px; margin-top: 18px; }
  .msg { text-align: center; padding: 50px 20px; }
  .msg h2 { font-size: 21px; margin-bottom: 8px; }
  .msg p { color: var(--muted); }
  .skel { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #eee, #f6f6f6, #eee); background-size: 200% 100%; animation: sk 1.2s infinite; margin: 10px 0; }
  @keyframes sk { to { background-position: -200% 0; } }
  .banner { margin-top: 14px; border-radius: 14px; padding: 10px 12px; font-size: 14.5px; font-weight: 600; }
  .banner.ok { background: #E7F5EC; color: var(--green); }
  .banner.bad { background: #FDECEC; color: #C4161C; }
  .demo { display: flex; align-items: center; gap: 10px; background: #1C1C1E; color: #fff; }
  .demo b { display: block; font-size: 15px; }
  .demo span { font-size: 13px; color: #C7C7CC; }
  .demo button { margin-left: auto; border: 0; border-radius: 12px; padding: 8px 12px; font-weight: 700; background: #fff; color: #1C1C1E; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

    } else if (destPt && !fitted) { map.jumpTo({ center: lngLat(destPt), zoom: 14 }); fitted = true; }
  }

  function tick() {
    if (!data) return;
    var v = document.getElementById("validity");
    if (v) {
      var a = Date.parse(data.created), z = Date.parse(data.expires), ms = z - Date.now();
      var ratio = z > a ? Math.max(0, Math.min(1, ms / (z - a))) : 0;
      var color = ms <= 0 || ratio < 0.2 ? "#C4161C" : ratio < 0.5 ? "#9A5B00" : "#1F7A3D";
      v.innerHTML = '<p class="sec">VIGENCIA DEL PEDIDO</p><div class="light"><i style="background:' + color + '"></i><div><b>' +
        (ms > 0 ? "Paga en los próximos " + left(ms) : "El plazo de pago terminó") + '</b><p style="color:var(--muted);font-size:13.5px">Hasta el ' + when(data.expires) +
        '</p></div></div><div class="meter"><i style="width:' + Math.round(ratio * 100) + "%;background:" + color + '"></i></div>';
    }
    var u = document.getElementById("upd");
    if (u && data.updated_at) u.textContent = "Actualizado " + when(data.updated_at);
    if (live && live.updated_at && !live.delivered_at && live.lat != null) {
      var info = document.getElementById("mapinfo");
      if (info) info.textContent = info.textContent.replace(/Actualizado .*$/, "Actualizado " + ago(live.updated_at));
    }
  }

  function rpc(fn, body) {
    return fetch(SUPABASE + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); });
  }
  function loadLive() {
    if (!data || (data.delivery !== "local" && data.carrier !== "Reparto propio")) return;
    if (demo) return;
    rpc("b2b_live_get", { p_token: token }).then(function (l) { if (l) { live = l; refresh(); showLive(l); } }).catch(function () {});
  }
  function load() {
    if (demo) return;
    if (!/^[a-z0-9]{16,64}$/.test(token)) return message("Enlace incompleto", "Abre el enlace completo que te mandamos por WhatsApp.");
    rpc("b2b_tracking_get", { p_token: token })
      .then(function (d) {
        if (!d || !d.folio) return message("Tu pedido aún no está publicado", "El enlace cambió o la tienda todavía no lo publica. Pídenos el enlace actualizado por WhatsApp.");
        data = d;
        refresh();
        loadLive();
      })
      .catch(function () { if (!data) message("Sin conexión", "No pudimos cargar tu pedido. Intenta de nuevo en un momento."); });
  }
  if (demo) demoRun(); else load();
  setInterval(function () { if (!demo) load(); }, 45000);
  // Con reparto en vivo, la ubicación se consulta cada 8 s mientras la página está a la vista.
  setInterval(function () { if (!demo && !document.hidden && live && live.active) loadLive(); }, LIVE_EVERY);
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", function () { if (!demo && !document.hidden) load(); });
})();
</script>
</body>
</html>
